services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: songs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5432 is commonly used by a local PostgreSQL installation.
      - "5433:5432"
    volumes:
      - songs_data:/var/lib/postgresql/data

volumes:
  songs_data:
